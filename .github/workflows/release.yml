name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: sxzz/workflows/.github/workflows/release.yml@main
    with:
      publish: true
    permissions:
      contents: write
      id-token: write

  crate:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate
        run: |
          crate=crates/tauri-plugin-cef-webview
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$crate/Cargo.toml" | head -1)
          if curl -sf -A "tauri-cef-webview-release" "https://crates.io/api/v1/crates/tauri-plugin-cef-webview/$version" > /dev/null; then
            echo "tauri-plugin-cef-webview $version is already on crates.io"
            exit 0
          fi
          # ponytail: no CEF binaries in CI, so skip the build verification cargo publish normally runs
          cargo publish --no-verify --manifest-path "$crate/Cargo.toml"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
