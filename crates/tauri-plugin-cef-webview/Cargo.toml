[package]
name = "tauri-plugin-cef-webview"
version = "0.4.1"
description = "Embed CEF child webviews in a Tauri frontend with a <webview> element"
authors = [ "hairyf" ]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hairyf/tauri-cef-webview"
homepage = "https://github.com/hairyf/tauri-cef-webview#readme"
links = "tauri-plugin-cef-webview"
build = "build.rs"

[features]
default = []
devtools = [ "tauri/devtools" ]
# Carves `data-cef-overlay` rectangles out of windowed child webviews
# (Windows, CEF runtime).
layering = [
  "dep:cef",
  "dep:tauri-runtime-cef"
]
# Renders child webviews into the host page with CEF off-screen rendering.
# Needs the CEF runtime and CEF binaries at build time.
offscreen = [
  "dep:cef",
  "dep:tauri-runtime",
  "dep:tauri-runtime-cef"
]

[dependencies]
cef = { version = "=154.5.0", optional = true }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.5", features = [ "unstable" ] }
tauri-runtime = { version = "3.0.0-alpha.4", optional = true }
tauri-runtime-cef = { version = "3.0.0-alpha.6", optional = true }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.4", features = [ "build" ] }
